<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="8.4cm" font-family="Times New Roman, Times, serif" text-rendering="geometricPrecision">
  <title>TinyVLM architecture</title>
  <desc>Four-stage pipeline: input (RGB + event stream), STTF sparse temporal token fusion with token cache, ANC adaptive neural compression with Gumbel-Softmax routing over three expert branches, and a conditional transformer decoder producing caption tokens. A loss callout appears at the bottom.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"></path>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07a1f"></path>
    </marker>
    <marker id="ahM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b0"></path>
    </marker>
    <pattern id="rgbHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#eef2f7"></rect>
      <rect width="3" height="6" fill="#dde3ec"></rect>
    </pattern>
  </defs>

  
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"></rect>

  
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#8a93a0" letter-spacing="1.6" text-anchor="middle">
    <text x="90" y="30">1 · INPUT</text>
    <text x="340" y="30">2 · STTF</text>
    <text x="640" y="30">3 · ANC</text>
    <text x="868" y="30">4 · DECODER</text>
  </g>

  
  
  <rect x="50" y="70" width="80" height="60" fill="#ffffff" stroke="#334155" stroke-width="0.8"></rect>
  <rect x="54" y="74" width="72" height="52" fill="url(#rgbHatch)"></rect>
  <circle cx="70" cy="92" r="4" fill="#cdd3dc"></circle>
  <path d="M58 122 L78 104 L96 118 L120 96 L120 122 Z" fill="#b6bcc6"></path>
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="90" y="148">RGB frame</text>
  </g>
  <g font-size="10" font-style="italic" fill="#1f3a5f" text-anchor="middle">
    <text x="90" y="164">I<tspan font-size="7" baseline-shift="sub">t</tspan> ∈ ℝ<tspan font-size="7" baseline-shift="super">3×H×W</tspan></text>
  </g>

  
  <rect x="50" y="200" width="80" height="60" fill="#ffffff" stroke="#334155" stroke-width="0.8"></rect>
  <g fill="#1f3a5f">
