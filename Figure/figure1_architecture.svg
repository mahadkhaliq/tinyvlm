  <g font-size="8.8" fill="#5b6470" text-anchor="middle">
    <text x="870" y="248">vocab = 8192</text>
    <text x="870" y="262">max_len = 64</text>
  </g>

  
  <path d="M870 282 L870 312" fill="none" stroke="#334155" stroke-width="1.1" marker-end="url(#ah)"></path>

  
  <g>
