      <rect x="440" y="172" width="11" height="11"></rect>
    </g>
    <rect x="414" y="159" width="11" height="11" fill="#e07a1f"></rect>
  </g>

  
  <path d="M354 150 L380 150" fill="none" stroke="#9aa3b0" stroke-width="0.8" stroke-dasharray="3 2.5" marker-end="url(#ahM)"></path>
  <text x="367" y="144" font-size="8.8" fill="#5b6470" text-anchor="middle">write</text>

  
  <path d="M380 175 C 340 220, 260 228, 240 214 C 230 206, 228 200, 236 194" fill="none" stroke="#e07a1f" stroke-width="1.2" marker-end="url(#ahA)"></path>
  <text x="300" y="236" font-size="9" fill="#e07a1f" font-style="italic" text-anchor="middle">reuse</text>

  
  <g>
    <rect x="232" y="266" width="10" height="10" fill="#e07a1f"></rect>
    <text x="248" y="275" font-size="8.8" fill="#5b6470">active</text>
    <rect x="292" y="266" width="10" height="10" fill="#e2e6ec"></rect>
    <text x="308" y="275" font-size="8.8" fill="#5b6470">cached</text>
  </g>

  
  <g font-size="10" font-style="italic" fill="#1f3a5f">
    <text x="224" y="306">‖ φ(I<tspan font-size="7" baseline-shift="sub">t</tspan>) − φ(I<tspan font-size="7" baseline-shift="sub">t−1</tspan>) ‖ &gt; τ  →  active</text>
  </g>
  <text x="440" y="306" font-size="8.8" fill="#e07a1f" text-anchor="end">(Eq. 2)</text>
  <text x="340" y="334" font-size="8.8" font-style="italic" fill="#5b6470" text-anchor="middle">Up to 84% of tokens reused across consecutive frames</text>

  
  <path d="M470 210 L508 210" fill="none" stroke="#334155" stroke-width="1.1" marker-end="url(#ah)"></path>

  
  <rect x="510" y="60" width="260" height="310" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"></rect>
  <text x="640" y="82" font-size="12" font-weight="600" fill="#1f3a5f" text-anchor="middle">ANC</text>
  <text x="640" y="96" font-size="9.5" font-style="italic" fill="#6b7280" text-anchor="middle">Adaptive Neural Compression</text>

  
  <rect x="522" y="114" width="92" height="48" rx="3" fill="#ffffff" stroke="#334155" stroke-width="0.8"></rect>
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="568" y="131" font-weight="600">Complexity</text>
    <text x="568" y="144" font-weight="600">Estimator</text>
  </g>
  <text x="568" y="156" font-size="8.8" fill="#5b6470" text-anchor="middle">2-layer CNN</text>

  
  <path d="M614 138 L646 138" fill="none" stroke="#334155" stroke-width="1.1" marker-end="url(#ah)"></path>
  <text x="630" y="132" font-size="8.8" font-style="italic" fill="#5b6470" text-anchor="middle">π</text>

  
  <rect x="648" y="114" width="112" height="48" rx="3" fill="#fdeedd" stroke="#e07a1f" stroke-width="1.0"></rect>
  <g text-anchor="middle" fill="#222" font-size="10">
    <text x="704" y="131" font-weight="600">Gumbel-Softmax</text>
    <text x="704" y="144" font-weight="600">Router</text>
  </g>
  <text x="704" y="157" font-size="8.8" fill="#e07a1f" text-anchor="middle">(Eq. 4)</text>

  
  <g font-size="10" font-style="italic" fill="#1f3a5f">
    <text x="524" y="188">g<tspan font-size="7" baseline-shift="sub">i</tspan> = softmax( (log π<tspan font-size="7" baseline-shift="sub">i</tspan> + G<tspan font-size="7" baseline-shift="sub">i</tspan>) / τ<tspan font-size="7" baseline-shift="sub">g</tspan> )</text>
  </g>

  
  <line x1="704" y1="162" x2="704" y2="206" stroke="#334155" stroke-width="1.0"></line>
  <line x1="554" y1="206" x2="726" y2="206" stroke="#9aa3b0" stroke-width="0.7" stroke-dasharray="3 2.5"></line>
  <line x1="554" y1="206" x2="554" y2="222" stroke="#9aa3b0" stroke-width="0.7" stroke-dasharray="3 2.5"></line>
  <line x1="640" y1="206" x2="640" y2="222" stroke="#e07a1f" stroke-width="1.2"></line>
