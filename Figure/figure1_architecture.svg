  <path d="M637 220 L640 226 L643 220 z" fill="#e07a1f"></path>
  <path d="M723 220 L726 226 L729 220 z" fill="#9aa3b0"></path>

  
  <rect x="518" y="228" width="74" height="72" rx="3" fill="#ffffff" stroke="#9aa3b0" stroke-width="0.8" stroke-dasharray="3 2"></rect>
  <g font-size="10" text-anchor="middle">
    <text x="555" y="246" fill="#5b6470" font-weight="600">Tiny</text>
    <text x="555" y="262" fill="#5b6470" font-size="8.8">2 layers</text>
    <text x="555" y="275" fill="#5b6470" font-size="8.8">d = 128</text>
    <text x="555" y="293" fill="#5b6470" font-size="8.8">≈ 2 GFLOPs</text>
  </g>

  
  <rect x="603" y="228" width="74" height="72" rx="3" fill="#fdeedd" stroke="#e07a1f" stroke-width="1.2"></rect>
  <g text-anchor="middle">
    <text x="640" y="246" font-size="10" fill="#b55c10" font-weight="700">Small</text>
    <text x="640" y="262" font-size="8.8" fill="#7a4510">4 layers</text>
    <text x="640" y="275" font-size="8.8" fill="#7a4510">d = 256</text>
    <text x="640" y="293" font-size="9" fill="#b55c10" font-weight="600">≈ 8 GFLOPs</text>
  </g>

  
  <rect x="689" y="228" width="74" height="72" rx="3" fill="#ffffff" stroke="#9aa3b0" stroke-width="0.8" stroke-dasharray="3 2"></rect>
  <g font-size="10" text-anchor="middle">
    <text x="726" y="246" fill="#5b6470" font-weight="600">Medium</text>
    <text x="726" y="262" fill="#5b6470" font-size="8.8">6 layers</text>
    <text x="726" y="275" fill="#5b6470" font-size="8.8">d = 384</text>
    <text x="726" y="293" fill="#5b6470" font-size="8.8">≈ 20 GFLOPs</text>
  </g>

  
