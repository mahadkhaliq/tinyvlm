  <text x="298" y="254" font-size="8.8" fill="#5b6470" text-anchor="middle">token grid (N × N)</text>

  
  <rect x="380" y="118" width="80" height="70" rx="4" fill="#ffffff" stroke="#334155" stroke-width="0.8"></rect>
  <text x="420" y="136" font-size="10" font-weight="600" fill="#222" text-anchor="middle">Token Cache</text>
