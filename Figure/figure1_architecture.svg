    <circle cx="84" cy="246" r="1.1"></circle><circle cx="106" cy="242" r="1.3"></circle>
  </g>
  <g fill="#e07a1f">
    <circle cx="92" cy="236" r="1.1"></circle><circle cx="118" cy="230" r="1.0"></circle><circle cx="58" cy="230" r="1.0"></circle>
  </g>
  <line x1="56" y1="252" x2="124" y2="252" stroke="#9aa3b0" stroke-width="0.5"></line>
