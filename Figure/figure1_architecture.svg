  <text x="870" y="358" font-size="10" font-style="italic" fill="#222" text-anchor="middle">Caption tokens y₁:<tspan font-style="italic">T</tspan></text>

  
  <rect x="50" y="410" width="860" height="80" rx="6" fill="#fafbfc" stroke="#cbd5e1" stroke-width="0.8"></rect>
