    <g fill="#e2e6ec">
      <rect x="232" y="114" width="18" height="18"></rect><rect x="272" y="114" width="18" height="18"></rect>
      <rect x="292" y="114" width="18" height="18"></rect><rect x="312" y="114" width="18" height="18"></rect>
