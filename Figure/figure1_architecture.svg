      <rect x="332" y="174" width="18" height="18"></rect>
      <rect x="232" y="194" width="18" height="18"></rect><rect x="272" y="194" width="18" height="18"></rect>
      <rect x="292" y="194" width="18" height="18"></rect><rect x="312" y="194" width="18" height="18"></rect>
      <rect x="332" y="194" width="18" height="18"></rect>
      <rect x="232" y="214" width="18" height="18"></rect><rect x="252" y="214" width="18" height="18"></rect>
