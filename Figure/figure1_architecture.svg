  <rect x="810" y="90" width="120" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"></rect>
  <g text-anchor="middle" fill="#1f3a5f" font-size="11" font-weight="600">
    <text x="870" y="112">Conditional</text>
    <text x="870" y="126">Transformer</text>
    <text x="870" y="140">Decoder</text>
  </g>
