  <g font-size="11" font-style="italic" fill="#1f3a5f">
    <text x="68" y="458">ℒ = ℒ<tspan font-size="7.5" baseline-shift="sub">CE</tspan> + 0.1 · ℒ<tspan font-size="7.5" baseline-shift="sub">FLOPs</tspan> + 0.01 · ℒ<tspan font-size="7.5" baseline-shift="sub">ent</tspan></text>
  </g>
  <text x="320" y="458" font-size="9" fill="#e07a1f">(Eq. 7)</text>
  <text x="68" y="478" font-size="9" fill="#5b6470" font-style="italic">target compute budget  5 × 10⁹ FLOPs per sample</text>

  
