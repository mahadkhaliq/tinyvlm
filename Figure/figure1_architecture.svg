    <line x1="82" y1="250" x2="82" y2="254"></line>
    <line x1="98" y1="250" x2="98" y2="254"></line>
    <line x1="114" y1="250" x2="114" y2="254"></line>
  </g>
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="90" y="278">Event stream</text>
  </g>
  <g font-size="10" font-style="italic" fill="#1f3a5f" text-anchor="middle">
    <text x="90" y="294">E<tspan font-size="7" baseline-shift="sub">t</tspan></text>
  </g>

  
  <path d="M132 100 Q 170 100 198 170" fill="none" stroke="#334155" stroke-width="1.1" marker-end="url(#ah)"></path>
  <path d="M132 230 Q 170 230 198 180" fill="none" stroke="#334155" stroke-width="1.1" marker-end="url(#ah)"></path>

  
